[package]
name = "ecbuild"
repo = "ecmwf/ecbuild"
compiler-inputs = []
visibility = "public"

[matrix.build.defaults]
job-script = "./.ci/runner/build.sh.j2"
build-type = "RelWithDebInfo"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"
c-compiler = "gcc-13"

[[matrix.build.include]]
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gcc8-gfortran8:latest"
platform = "rocky-8"
cxx-compiler = "g++-8"
c-compiler = "gcc-8"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/debian11-gcc10-gfortran10:latest"
platform = "debian-11"
c-compiler = "gcc-10"

[[matrix.build.include]]
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-arm64"]
platform = "macos-13-arm"

[[matrix.build.include]]
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-x86_64"]
platform = "macos-13-x86"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-15"
c-compiler = "gcc-15"
container = "eccr.ecmwf.int/public-ci-images/ubuntu26.04-gcc15-gfortran15"
platform = "ubuntu-26.04"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-11"
c-compiler = "gcc-11"
container = "eccr.ecmwf.int/public-ci-images/rocky9-gcc11-gfortran11"
platform = "rocky-9"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/rocky10-gcc14-gfortran14"
platform = "rocky-10"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-12"
c-compiler = "gcc-12"
container = "eccr.ecmwf.int/public-ci-images/debian12-gcc12-gfortran12"
platform = "debian-12"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/debian13-gcc14-gfortran14"
platform = "debian-13"

[matrix.build]
triggers = ["rebuild-request"]

[[matrix.test.include]]
build-type = "RelWithDebInfo"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"
c-compiler = "gcc-13"
cxx-compiler = "g++-13"
fortran-compiler = "gfortran-13"
job-script = "./.ci/runner/test.sh.j2"

# No `triggers`: ci.yml-only, nothing rendered into cross-repo-trigger.yml.
[matrix.test]
publishes = false
needs = ["build"]

[matrix.build-hpc.defaults]
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
ntasks = 2
ssdtmp = "1G"
job-script = "./.ci/hpc/build.sh.j2"

[[matrix.build-hpc.include]]
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load python3/3.13.13-01"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
time = "00:30:00"
tests = true

[[matrix.build-hpc.include]]
platform = "hpc-atos-intel"
modules = ["load prgenv/intel-llvm", "unload intel", "load intel/2025.3.1", "load cmake", "load python3/3.13.13-01"]
c-compiler-binary = "icx"
cxx-compiler-binary = "icpx"
time = "00:30:00"
tests = true

[[matrix.build-hpc.include]]
platform = "hpc-atos-aocc"
modules = ["load prgenv/amd", "unload aocc", "load aocc/4.0.0", "load cmake"]
c-compiler-binary = "clang"
cxx-compiler-binary = "clang++"
time = "00:15:00"
tests = false

[[matrix.build-hpc.include]]
platform = "hpc-atos-nvidia"
modules = ["load prgenv/nvidia", "unload nvidia", "load nvidia/24.11", "load cmake"]
c-compiler-binary = "nvc"
cxx-compiler-binary = "nvc++"
time = "00:15:00"
tests = false

[matrix.build-hpc]
execution = "hpc-atos"
container-credentials = true
triggers = ["rebuild-request"]

[[trigger-downstream]]
repo = "ecmwf/eckit"
ref = "develop"

[[trigger-downstream]]
repo = "ecmwf/eccodes"
ref = "develop"

[[trigger-downstream]]
repo = "ecmwf/ecflow"
ref = "develop"

[[trigger-downstream]]
repo = "ecmwf/fckit"
ref = "develop"

[[trigger-downstream]]
repo = "ecmwf/atlas"
ref = "develop"
