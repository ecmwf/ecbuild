[package]
name = "ecbuild"
prefix = "ecbuild"
repo = "ecmwf/ecbuild"
compiler-inputs = []
visibility = "public"

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
build-type = "Release"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"

[matrix.build]
triggers = ["rebuild-request"]
action = "./.github/actions/build-ecbuild"
forwarded-inputs = ["build-type"]
needs = []
ctest = true
ctest-args = '-j "$(nproc)"'

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
job-script = "./.ci/hpc/build-gnu.sh"

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
job-script = "./.ci/hpc/build-intel.sh"

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
job-script = "./.ci/hpc/build-aocc.sh"

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
job-script = "./.ci/hpc/build-nvidia.sh"

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build-gnu.sh"
triggers = ["rebuild-request"]
needs = []

[[trigger-downstream]]
repo = "ecmwf/eckit"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/eccodes"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/ecflow"
ref = "sync-branch-ci-rollout"
