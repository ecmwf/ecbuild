[package]
name = "ecbuild"
prefix = "ecbuild"
repo = "ecmwf/ecbuild"
# ecbuild produces a single compiler-independent install tree; no compiler is
# part of its artifact identity.
compiler-inputs = []

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-playground-ci/ubuntu24.04-base:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
build-type = "Release"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"

[matrix.build]
triggers = ["rebuild-request"]
action = "./.github/actions/build-ecbuild"
forwarded-inputs = ["build-type"]
needs = []
