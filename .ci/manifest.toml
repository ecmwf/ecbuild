[package]
name = "ecbuild"
prefix = "ecbuild"
repo = "ecmwf/ecbuild"
# ecbuild produces a single compiler-independent install tree; no compiler is
# part of its artifact identity.
compiler-inputs = []
# ecbuild is public, so its fan-out calls consumers' cross-repo-trigger.yml via
# `uses:` rather than dispatching them.
visibility = "public"

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
build-type = "Release"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"

[matrix.build]
triggers = ["rebuild-request"]
action = "./.github/actions/build-ecbuild"
forwarded-inputs = ["build-type"]
needs = []
# Matches ci.yml's build+test job. In practice this only ever runs on the
# consumer-driven recovery path (rebuild-request is our only trigger) — and that
# is exactly the path where it matters most: the waiting consumer takes the
# artifact the moment it appears, so testing before publishing is what stops it
# picking up a red build.
ctest = true
# ctest defaults to one test at a time, which leaves the whole runner idle but
# for one test.
ctest-args = '-j "$(nproc)"'

# --- HPC build --------------------------------------------------------------
# The ecbuild install tree built inside a SLURM job, so every HPC consumer
# find_package()s the cluster-built copy rather than the container one.
# compiler-inputs is [] here as on the runner lane, so this artifact is shared by
# every HPC toolchain; only platform separates it from the container build.
#
# runs-on/container/site are scheduling only and never enter the artifact name.
# The container carries the cluster ssh identity (keys, the hpc-batch alias,
# known_hosts) without which troika cannot submit; it is private, hence
# container-credentials.
[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
job-script = "./.ci/hpc/build-gnu.sh"

# The same tree under the intel platform slug, for ecflow's hpc-atos-intel leg.
# Every consumer resolves its deps at its OWN platform slug, so that leg looks
# for ecbuild-<sha>-hpc-atos-intel-Release.
#
# The install tree is byte-identical to the gnu leg's (compiler-inputs = [] and
# there is nothing compiler-dependent to install), so this leg exists for the
# platform slug and for one real gain: it runs the test suite under the intel
# toolchain, which is the only place ecbuild's macros are exercised there.
# `job-script` is per-leg and is NOT part of identity.
[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
job-script = "./.ci/hpc/build-intel.sh"

# Build-only platforms, for ecflow's aocc and nvidia legs. Same reason as the
# intel leg: consumers resolve deps at their OWN platform slug, so those legs
# look for ecbuild-<sha>-hpc-atos-{aocc,nvidia}-Release. Their recipes run no
# ctest, matching the legacy ci-hpc-config.yml platforms they mirror.
[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
job-script = "./.ci/hpc/build-aocc.sh"

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
job-script = "./.ci/hpc/build-nvidia.sh"

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build-gnu.sh"
# A leaf producer: nothing upstream can strand this artifact, but a consumer
# that cannot find it must be able to ask for a rebuild.
triggers = ["rebuild-request"]
needs = []

# --- downstream CI fan-out ---------------------------------------------------
# Every ECMWF package here find_package()s ecbuild, so a change to it has to be
# proved against all three. `ref` is the consumer-side ref the orchestrator pins
# its `uses:` to; runtime branch matching can still redirect the source checkout
# to a same-named branch (e.g. sync-branch-ci-rollout) independently.
# ROLLOUT NOTE: pinned to the sync branch on purpose, and TEMPORARY.
# `uses:` cannot take an expression, so `ref` selects which WORKFLOW DEFINITION
# runs. Pointing it at the sync branch lets the full downstream CI be exercised
# before the rollout merges: the orchestrator lives on the default branch
# (workflow_run only ever runs the default-branch copy) while the consumer logic
# it calls comes from the sync branch. Source checkout and artifact refs are
# resolved independently at runtime by pick-ref and resolve_deps' sync-branch
# override.
# FLIP TO develop AND REGENERATE WHEN THE ROLLOUT MERGES.
[[trigger-downstream]]
repo = "ecmwf/eckit"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/eccodes"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/ecflow"
ref = "sync-branch-ci-rollout"
