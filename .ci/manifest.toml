[package]
name = "ecbuild"
prefix = "ecbuild"
repo = "ecmwf/ecbuild"
compiler-inputs = []
visibility = "public"

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
build-type = "Release"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/rocky8-base:latest"
platform = "rocky-8"

[[matrix.build.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/debian11-base:latest"
platform = "debian-11"

[[matrix.build.include]]
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-arm64"]
platform = "macos-13-arm"

[[matrix.build.include]]
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-x86_64"]
platform = "macos-13-x86"

[matrix.build]
triggers = ["rebuild-request"]
action = "./.github/actions/build-ecbuild"
forwarded-inputs = ["build-type"]
needs = []

[[matrix.test.include]]
build-type = "Release"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gfortran13:latest"
platform = "ubuntu-24.04"

# No `triggers`: ci.yml-only, nothing rendered into cross-repo-trigger.yml.
[matrix.test]
publishes = false
action = "./.github/actions/test-ecbuild"
forwarded-inputs = ["build-type"]
needs = ["build"]

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load python3/3.13.13-01"]
cc = "gcc"
cxx = "g++"
time = "00:30:00"
tests = true

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
modules = ["load prgenv/intel-llvm", "unload intel", "load intel/2025.3.1", "load cmake", "load python3/3.13.13-01"]
cc = "icx"
cxx = "icpx"
time = "00:30:00"
tests = true

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
modules = ["load prgenv/amd", "unload aocc", "load aocc/4.0.0", "load cmake"]
cc = "clang"
cxx = "clang++"
time = "00:15:00"
tests = false

[[matrix.build-hpc.include]]
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
modules = ["load prgenv/nvidia", "unload nvidia", "load nvidia/24.11", "load cmake"]
cc = "nvc"
cxx = "nvc++"
time = "00:15:00"
tests = false

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build.sh.j2"
triggers = ["rebuild-request"]
needs = []

[[trigger-downstream]]
repo = "ecmwf/eckit"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/eccodes"
ref = "sync-branch-ci-rollout"

[[trigger-downstream]]
repo = "ecmwf/ecflow"
ref = "sync-branch-ci-rollout"

[downstream-gate]
label = "run-downstream-CI"
