# Vendored upstream examples; not ours to lint or format.
exclude: '^examples/find_package/projects/(hdf5/hdf5_examples|netcdf/netcdf_examples)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^\.cd/conda/meta\.yaml$'  # conda recipe: Jinja, not YAML
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # `reuse lint` checks the whole project. The hook is passed no filenames, so
  # it cannot be narrowed by an exclude; always_run keeps it honest for a commit
  # that happens to touch nothing it would otherwise see.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true

  - repo: https://github.com/ecmwf/ci-infrastructure
    rev: dac4b18ffe60c317fbab05246e851b6971f7eabf
    hooks:
      - id: check-ci-approval
