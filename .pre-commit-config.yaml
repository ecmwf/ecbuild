# Vendored upstream examples; not ours to lint or format.
exclude: '^examples/find_package/projects/(hdf5/hdf5_examples|netcdf/netcdf_examples)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^\.cd/conda/meta\.yaml$'  # conda recipe: Jinja, not YAML
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/ecmwf/ci-infrastructure
    rev: edf5d3f3caa2c6f8a49458449005ee9d7742c16f
    hooks:
      - id: check-ci-approval
      - id: check-ci-result
