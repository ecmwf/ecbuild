name: CI

on:
  push:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "bamboo/**"
      - "README.rst"
      - ".cd/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - "docs/**"
      - "bamboo/**"
      - "README.rst"
      - ".cd/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_POLL_INTERVAL: ${{ vars.ARTIFACT_POLL_INTERVAL || '60' }}
  ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
  ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  ci-approval:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  resolve:
    needs: ci-approval
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    outputs:
      build-matrix: ${{ steps.r.outputs.matrix-build }}
      test-matrix: ${{ steps.r.outputs.matrix-test }}
      build-hpc-matrix: ${{ steps.r.outputs.matrix-build-hpc }}
    steps:
      - id: mint
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          current-branch: ${{ github.head_ref || github.ref_name }}
          matrix: build,test,build-hpc
          token: ${{ steps.mint.outputs.token }}
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}

  build:
    needs: resolve
    name: build (${{ matrix.platform }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Build ecbuild
        id: build
        uses: ./.github/actions/build-ecbuild
        with:
          build-type: ${{ matrix.build-type }}

      - name: Publish ecbuild
        uses: ecmwf/ci-infrastructure/actions/fetch-and-publish@main
        with:
          mode: publish
          install-path: ${{ steps.build.outputs.install-path }}
          artifact-name: ${{ matrix._resolved.own-artifact-name }}

  test:
    needs: resolve
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Test ecbuild
        uses: ./.github/actions/test-ecbuild
        with:
          build-type: ${{ matrix.build-type }}

  build-hpc:
    needs: resolve
    name: build-hpc (${{ matrix.platform }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-hpc-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Build ecbuild on HPC
        uses: ecmwf/ci-infrastructure/actions/build-on-hpc@main
        with:
          site: ${{ matrix.site }}
          job-script: ${{ matrix.job-script || './.ci/hpc/build-gnu.sh' }}
          artifact-name: ${{ matrix._resolved.own-artifact-name }}
          work-dir: ${{ vars.HPC_CI_WORK_DIR }}
          remote-work-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
