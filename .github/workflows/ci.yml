name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_POLL_INTERVAL: ${{ vars.ARTIFACT_POLL_INTERVAL || '60' }}
  ARTIFACT_WAIT_TIMEOUT: ${{ vars.ARTIFACT_WAIT_TIMEOUT || '1800' }}
  ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
  ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  ci-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  pre-commit:
    needs: ci-approval
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ecmwf/ci-infrastructure/actions/pre-commit@main

  resolve:
    needs: ci-approval
    runs-on: ubuntu-latest
    outputs:
      matrices: ${{ steps.r.outputs.json }}
    steps:
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: ecbuild
          permissions: contents:read actions:read
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          matrix: build,test
          token: ${{ steps.mint.outputs.token }}

  build:
    needs: [ci-approval, resolve, pre-commit]
    name: build (${{ matrix._resolved['job-name'] }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrices).build }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: ecbuild
          permissions: contents:read actions:read
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch resolved deps
        id: deps
        uses: ecmwf/ci-infrastructure/actions/fetch-deps@main
        with:
          deps-json: ${{ toJSON(matrix._resolved.deps) }}
          token: ${{ steps.mint.outputs.token }}
      - name: Print dependency table
        uses: ecmwf/ci-infrastructure/actions/print-dep-table@main
        with:
          resolved: ${{ toJSON(matrix._resolved) }}
      - name: Build
        id: build
        uses: ecmwf/ci-infrastructure/actions/run-job-script@main
        with:
          job-script: ${{ matrix.job-script }}
          matrix-leg: ${{ toJSON(matrix) }}
          package: ecbuild
          cmake-prefix-path: ${{ steps.deps.outputs.cmake-prefix-path }}
      - name: Publish
        uses: ecmwf/ci-infrastructure/actions/publish-artifact@main
        with:
          install-path: ${{ steps.build.outputs.install-path }}
          artifact-name: ${{ matrix._resolved['own-artifact-name'] }}

  test:
    needs: [ci-approval, resolve, build]
    name: test (${{ matrix._resolved['job-name'] }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrices).test }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: ecbuild
          permissions: contents:read actions:read
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch resolved deps
        id: deps
        uses: ecmwf/ci-infrastructure/actions/fetch-deps@main
        with:
          deps-json: ${{ toJSON(matrix._resolved.deps) }}
          token: ${{ steps.mint.outputs.token }}
      - name: Print dependency table
        uses: ecmwf/ci-infrastructure/actions/print-dep-table@main
        with:
          resolved: ${{ toJSON(matrix._resolved) }}
      - name: Run
        id: build
        uses: ecmwf/ci-infrastructure/actions/run-job-script@main
        with:
          job-script: ${{ matrix.job-script }}
          matrix-leg: ${{ toJSON(matrix) }}
          package: ecbuild
          cmake-prefix-path: ${{ steps.deps.outputs.cmake-prefix-path }}

  ci-result:
    name: collect results
    if: always()
    needs: [ci-approval, pre-commit, resolve, build, test]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/ci-result@main
        with:
          needs: ${{ toJSON(needs) }}
