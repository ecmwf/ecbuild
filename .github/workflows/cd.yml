name: CD

on:
  push:
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+-*'
    branches:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Dispatch CI on this same branch/commit first. Manual CD never publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Validate source and plan CD
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch ||
      (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.label.name == 'approved-for-cd')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      ref_name: ${{ steps.detect.outputs.ref_name }}
      dry_run: ${{ steps.detect.outputs.is_dry_run }}
      prerelease: ${{ steps.detect.outputs.is_prerelease }}
      conda_matrix: ${{ steps.plan.outputs.conda }}
      hpc_matrix: ${{ steps.plan.outputs.hpc }}
      sync_matrix: ${{ steps.config.outputs.hpc_sync_tag_matrix }}
      release_enabled: ${{ steps.config.outputs.release_enabled }}
      release_config: ${{ steps.plan.outputs.release_config }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve source commit (peel annotated tags)
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
      - name: Require CI for release or manual test
        if: github.event_name != 'pull_request'
        uses: ecmwf/reusable-workflows/cd-actions/require-successful-ci@feature/ci-gated-cd
        with:
          source_sha: ${{ steps.source.outputs.sha }}
          allowed_events: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
          allowed_branches: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master,develop' }}
      - name: Explain PR preview policy
        if: github.event_name == 'pull_request'
        run: echo 'PR preview only; not accepted as release CI evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Detect release policy
        id: detect
        uses: ecmwf/reusable-workflows/cd-actions/detect-release-type@v2
        with:
          ref_name: ${{ github.head_ref || github.ref_name }}
          dry_run: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
          deployment_regex: ${{ vars.TAG_REGEX_FOR_DEPLOYMENT }}
          prerelease_regex: ${{ vars.TAG_REGEX_FOR_PRERELEASE }}
      - name: Load CD configuration
        id: config
        uses: ecmwf/reusable-workflows/cd-actions/load-config@v2
      - name: Plan ecbuild delivery jobs
        id: plan
        env:
          BUILD_MATRIX: ${{ steps.config.outputs.build_matrix }}
          CD_CONFIG: ${{ steps.config.outputs.config }}
          IS_PRERELEASE: ${{ steps.detect.outputs.is_prerelease }}
        run: python3 .github/scripts/plan-cd.py

  conda:
    name: Conda (${{ matrix.name }})
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.conda_matrix).include[0] != null }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
      options: '--user root'
      volumes:
        - '/var/run/docker.sock:/var/run/docker.sock'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.conda_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ecmwf/reusable-workflows/cd-actions/conda@v2
        with:
          name: ${{ matrix.name }}
          platform: ${{ matrix.conda_platform }}
          setup_conda: ${{ matrix.setup_conda }}
          ref_name: ${{ needs.prepare.outputs.ref_name }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          test_nexus: ${{ needs.prepare.outputs.prerelease }}
          gh_pat: ${{ secrets.GH_REPO_READ_TOKEN }}
          nexus_token: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.NEXUS_CONDA_UPLOAD_USER && secrets.NEXUS_CONDA_UPLOAD_TOKEN && format('{0}:{1}', secrets.NEXUS_CONDA_UPLOAD_USER, secrets.NEXUS_CONDA_UPLOAD_TOKEN) || '' }}
          nexus_test_token: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.NEXUS_TEST_CONDA_UPLOAD_USER && secrets.NEXUS_TEST_CONDA_UPLOAD_TOKEN && format('{0}:{1}', secrets.NEXUS_TEST_CONDA_UPLOAD_USER, secrets.NEXUS_TEST_CONDA_UPLOAD_TOKEN) || '' }}
          conda_dir: ${{ matrix.conda_dir }}
          channels: ${{ matrix.channels }}
          conda_build_args: ${{ matrix.conda_build_args }}
          skip_installation_test: ${{ matrix.skip_installation_test }}

  hpc:
    name: HPC (${{ matrix.name }})
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.hpc_matrix).include[0] != null }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
      options: '--user root'
      volumes:
        - '/var/run/docker.sock:/var/run/docker.sock'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.hpc_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: ecmwf/reusable-workflows/cd-actions/hpc@v2
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.prepare.outputs.ref_name }}
          sha: ${{ needs.prepare.outputs.source_sha }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          github_user: ${{ secrets.BUILD_PACKAGE_HPC_GITHUB_USER }}
          github_token: ${{ secrets.GH_REPO_READ_TOKEN }}
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          platform: ${{ matrix.platform }}
          install_prefix: ${{ matrix.install_prefix }}
          prefix_compiler_specific: ${{ matrix.prefix_compiler_specific }}
          cmake_options: ${{ matrix.cmake_options }}
          ctest_options: ${{ matrix.ctest_options }}
          self_test: ${{ matrix.self_test }}
          env_vars: ${{ matrix.env_vars }}
          parallel: ${{ matrix.parallel }}
          dependencies: ${{ matrix.dependencies }}
          dependency_cmake_options: ${{ matrix.dependency_cmake_options }}
          python_dependencies: ${{ matrix.python_dependencies }}
          python_version: ${{ matrix.python_version }}
          python_requirements: ${{ matrix.python_requirements }}
          python_toml_opt_dep_sections: ${{ matrix.python_toml_opt_dep_sections }}
          conda_deps: ${{ matrix.conda_deps }}
          stages: ${{ matrix.stages }}
          modules: ${{ matrix.modules }}
          install_command: ${{ matrix.install_command }}
          lock_permissions: ${{ matrix.lock_permissions }}
          module_name: ${{ matrix.module_name }}
          ntasks: ${{ matrix.ntasks }}
          gpus: ${{ matrix.gpus }}
          queue: ${{ matrix.queue }}
          post_script: ${{ matrix.post_script }}
          clean_before_install: ${{ matrix.clean_before_install }}
          # The pilot's previews must never install, even if config opts in.
          dry_run_install: 'false'
          site: ${{ matrix.site }}
          use_ninja: ${{ matrix.use_ninja }}
          force_build: ${{ matrix.force_build }}
          ecbundle: ${{ matrix.ecbundle }}
          bundle_yml: ${{ matrix.bundle_yml }}
          install_lib_dir: ${{ matrix.install_lib_dir }}
          mkdir: ${{ matrix.mkdir }}
          pytest_cmd: ${{ matrix.pytest_cmd }}
          workdir: ${{ matrix.workdir }}
          output_dir: ${{ matrix.output_dir }}

  hpc-sync-tag:
    name: Sync/tag HPC (${{ matrix.name }})
    needs: [prepare, conda, hpc]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.dry_run == 'false' &&
          (needs.conda.result == 'success' || needs.conda.result == 'skipped') &&
          needs.hpc.result == 'success' &&
          fromJSON(needs.prepare.outputs.sync_matrix).include[0] != null }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.sync_matrix) }}
    steps:
      - uses: ecmwf/reusable-workflows/cd-actions/hpc-sync-tag@v2
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.prepare.outputs.ref_name }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          is_prerelease: ${{ needs.prepare.outputs.prerelease }}
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          site: ${{ matrix.site }}
          module_name: ${{ matrix.module_name }}
          sync_module: ${{ matrix.sync_module }}
          tag_module: ${{ matrix.tag_module }}
          module_tag_name: ${{ matrix.module_tag_name || vars.HPC_MODULE_TAG_NAME || 'new' }}
          queue: ${{ matrix.queue }}
          workdir: ${{ matrix.workdir }}
          output_dir: ${{ matrix.output_dir }}

  release:
    name: Create GitHub release
    needs: [prepare, conda, hpc, hpc-sync-tag]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_enabled == 'true' &&
          needs.prepare.outputs.dry_run == 'false' &&
          (needs.conda.result == 'success' || needs.conda.result == 'skipped') &&
          (needs.hpc.result == 'success' || needs.hpc.result == 'skipped') &&
          (needs.hpc-sync-tag.result == 'success' || needs.hpc-sync-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: ecmwf/reusable-workflows/cd-actions/release@v2
        with:
          config: ${{ needs.prepare.outputs.release_config }}
          ref_name: ${{ needs.prepare.outputs.ref_name }}
