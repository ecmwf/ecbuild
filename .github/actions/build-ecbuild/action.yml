name: Build ecbuild from source
description: >
  Configures, builds and installs the already-checked-out ecbuild (a
  compiler-independent CMake toolchain collection) to a canonical prefix
  derived from the shared install-prefix action. Caller must have already run
  actions/checkout@v6 in the same job — the action reads the source from
  $GITHUB_WORKSPACE.

  The test suite lives in .github/actions/test-ecbuild.

inputs:
  build-type:
    description: 'CMake build type'
    required: false
    default: RelWithDebInfo

outputs:
  install-path:
    description: 'Absolute path where ecbuild is installed'
    value: ${{ steps.set-paths.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree, for ctest'
    value: ${{ steps.set-paths.outputs.build-dir }}

runs:
  using: composite
  steps:
    - name: Get install prefix
      id: prefix
      uses: ecmwf/ci-infrastructure/actions/install-prefix@main

    - name: Set paths
      id: set-paths
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "install-path=${{ steps.prefix.outputs.base }}/ecbuild"
          echo "build-dir=$RUNNER_TEMP/_ecbuild-build"
        } >> "$GITHUB_OUTPUT"

    - name: Configure ecbuild
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_PATH: ${{ steps.set-paths.outputs.install-path }}
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake -S "$GITHUB_WORKSPACE" \
              -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PATH"

    - name: Build and install ecbuild
      shell: bash
      env:
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake --build "$BUILD_DIR" --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
        cmake --install "$BUILD_DIR"
