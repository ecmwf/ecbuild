name: Build ecbuild from source
description: >
  Builds and installs the checked-out ecbuild (a compiler-independent CMake
  toolchain collection) with ecmwf/ci-infrastructure/actions/cmake-build, which
  documents the inputs. Nothing worth caching is compiled, so no sccache.

  The test suite lives in .github/actions/test-ecbuild.

inputs:
  build-type:
    description: 'CMake build type'
    required: false
    default: RelWithDebInfo
  c-compiler:
    description: >
      C compiler, e.g. gcc-13. The gcc images ship only versioned names; empty
      leaves CMake to find `cc` on images that have one.
    required: false
    default: ''

outputs:
  install-path:
    description: 'Absolute path where ecbuild is installed'
    value: ${{ steps.build.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree, for ctest'
    value: ${{ steps.build.outputs.build-dir }}

runs:
  using: composite
  steps:
    - id: build
      uses: ecmwf/ci-infrastructure/actions/cmake-build@main
      with:
        package: ecbuild
        c-compiler: ${{ inputs.c-compiler }}
        build-type: ${{ inputs.build-type }}
        sccache: 'false'
