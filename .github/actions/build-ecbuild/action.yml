name: Build ecbuild from source
description: >
  Configures, builds and installs the already-checked-out ecbuild (a
  compiler-independent CMake toolchain collection) to a canonical prefix
  derived from the shared install-prefix action, and leaves the build tree in
  place so the caller can run ctest against it without reconfiguring. Caller
  must have already run actions/checkout@v6 in the same job — the action reads
  the source from $GITHUB_WORKSPACE.

inputs:
  build-type:
    description: 'CMake build type'
    required: false
    default: Release

outputs:
  install-path:
    description: 'Absolute path where ecbuild is installed'
    value: ${{ steps.set-paths.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree, for ctest'
    value: ${{ steps.set-paths.outputs.build-dir }}

runs:
  using: composite
  steps:
    - name: Get install prefix
      id: prefix
      uses: ecmwf/ci-infrastructure/actions/install-prefix@main

    - name: Set paths
      id: set-paths
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "install-path=${{ steps.prefix.outputs.base }}/ecbuild"
          echo "build-dir=$RUNNER_TEMP/_ecbuild-build"
        } >> "$GITHUB_OUTPUT"

    # Four of the tests (shared_libs, override_compiler_flags{,_bailout} and
    # test_custom_build_type) declare Fortran in their fixture project's
    # `project()` call, so ctest needs a Fortran compiler even though ecbuild
    # itself is LANGUAGES C and nothing that CONSUMES ecbuild needs Fortran.
    #
    # Installed here rather than solved in the manifest or the image, on purpose:
    #   - the manifest must not name a Fortran compiler. ecbuild produces one
    #     compiler-independent install tree (compiler-inputs = []), and saying
    #     otherwise would imply its consumers need Fortran, which they do not.
    #   - swapping the leg to the gfortran13 image does NOT fix it: those images
    #     ship only versioned binaries (gfortran-13, no unversioned gfortran) --
    #     which is exactly why eccodes has to pass -DCMAKE_Fortran_COMPILER --
    #     and these fixture projects name no compiler, so CMake's own search for
    #     `gfortran`/`f95` finds nothing. The unversioned metapackage is what
    #     makes them discoverable without anyone declaring anything.
    # A no-op on GitHub-hosted runners, which already ship gfortran -- that leg
    # was the only one green before this. The base image installs sudo precisely
    # so this line works as root in a container and as a normal user on a runner.
    - name: Install gfortran for the test suite
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gfortran

    # ENABLE_TESTS=ON so tests/ and regressions/ are configured and their
    # targets built — ecbuild's suite is ecbuild_add_test(TYPE SCRIPT) all the
    # way down (nested cmake configures of small fixture projects), so it
    # reaches the network for nothing. The caller runs ctest against build-dir.
    - name: Configure ecbuild
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_PATH: ${{ steps.set-paths.outputs.install-path }}
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake -S "$GITHUB_WORKSPACE" \
              -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PATH" \
              -DENABLE_TESTS=ON

    - name: Build and install ecbuild
      shell: bash
      env:
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake --build "$BUILD_DIR" --parallel "$(nproc)"
        cmake --install "$BUILD_DIR"
